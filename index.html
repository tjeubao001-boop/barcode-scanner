<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Scanner Widget</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #reader {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #statusText {
      font-size: 14px;
      color: #38bdf8;
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="statusText">Đang kết nối camera...</div>

  <script>
    let html5QrCode = null;

    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");

      // Cấu hình quét mã vạch tối ưu
      const config = {
        fps: 25, // Tăng tốc độ đọc lên 25 khung hình/giây
        qrbox: { width: 320, height: 160 }, // Khung chữ nhật nằm ngang phù hợp với tem mã vạch
        aspectRatio: 1.0,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // Kích hoạt bộ quét mã vạch phần cứng của máy
        }
      };

      // Tự động tìm Camera sau có độ phân giải cao để lấy nét tự động
      const cameraConstraints = {
        facingMode: "environment",
        width: { min: 640, ideal: 1280, max: 1920 },
        height: { min: 480, ideal: 720, max: 1080 }
      };

      html5QrCode.start(
        cameraConstraints,
        config,
        (decodedText) => {
          // Báo thành công trên màn hình scanner
          document.getElementById('statusText').innerText = "✅ ĐÃ ĐỌC MÃ: " + decodedText;

          // Gửi dữ liệu mã vạch về ứng dụng Google Apps Script
          if (window.opener) {
            window.opener.postMessage({ type: 'BARCODE_SCANNED', code: decodedText }, '*');
          }
          if (window.parent) {
            window.parent.postMessage({ type: 'BARCODE_SCANNED', code: decodedText }, '*');
          }
        },
        (errorMessage) => {
          // Đang trong tiến trình dò mã...
        }
      ).then(() => {
        document.getElementById('statusText').innerText = "🔍 Hãy đưa mã vạch vào giữa ô chữ nhật...";
      }).catch(err => {
        document.getElementById('statusText').innerText = "❌ Không mở được camera: " + err;
      });
    }

    window.onload = function() {
      setTimeout(initCamera, 300);
    };
  </script>
</body>
</html>
