<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Scanner Widget</title>
  <!-- Dùng CDN HTML5-QRCode bản mới nhất -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #statusText {
      font-size: 14px;
      color: #38bdf8;
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="statusText">Đang khởi tạo camera...</div>

  <script>
    let html5QrCode = null;

    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");

      // Khai báo rõ các chuẩn Barcode 1D thông dụng nhất trong kho vận (Code 128, Code 39, EAN, UPC)
      const config = {
        fps: 30, // Tăng tốc độ đọc khung hình lên tối đa
        qrbox: { width: 320, height: 130 }, // Khung chữ nhật hẹp theo chiều ngang cho tem mã vạch
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // Tận dụng bộ giải mã phần cứng Android/iOS
        }
      };

      // Yêu cầu Camera độ phân giải sắc nét
      const cameraConstraints = {
        facingMode: "environment",
        width: { min: 1280, ideal: 1920 },
        height: { min: 720, ideal: 1080 }
      };

      html5QrCode.start(
        cameraConstraints,
        config,
        (decodedText) => {
          document.getElementById('statusText').innerText = "✅ ĐÃ ĐỌC MÃ: " + decodedText;

          // Gửi dữ liệu về ứng dụng chính Apps Script
          if (window.opener) {
            window.opener.postMessage({ type: 'BARCODE_SCANNED', code: decodedText }, '*');
          }
          if (window.parent) {
            window.parent.postMessage({ type: 'BARCODE_SCANNED', code: decodedText }, '*');
          }
        },
        (errorMessage) => {
          // Đang rà soát mã vạch...
        }
      ).then(() => {
        document.getElementById('statusText').innerText = "🔍 Đưa mã vạch vào khung hình...";
      }).catch(err => {
        document.getElementById('statusText').innerText = "❌ Lỗi mở camera: " + err;
      });
    }

    window.onload = function() {
      setTimeout(initCamera, 300);
    };
  </script>
</body>
</html>
